<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" shape-rendering="crispEdges">
  <!-- e-ink 1-bit icon: white bg, black shapes only, bold, no gradients/antialiasing needed -->
  <rect x="0" y="0" width="200" height="200" fill="#ffffff"/>

  <!-- sound wave arcs, both sides of mic -->
  <path d="M 44 78 A 40 40 0 0 0 44 122" stroke="#000000" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M 30 66 A 58 58 0 0 0 30 134" stroke="#000000" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M 156 78 A 40 40 0 0 1 156 122" stroke="#000000" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M 170 66 A 58 58 0 0 1 170 134" stroke="#000000" stroke-width="9" fill="none" stroke-linecap="round"/>

  <!-- mic capsule -->
  <rect x="76" y="26" width="48" height="76" rx="24" ry="24" fill="#000000"/>
  <rect x="76" y="26" width="48" height="76" rx="24" ry="24" fill="none" stroke="#000000" stroke-width="2"/>

  <!-- mic grille lines (white cutouts) -->
  <rect x="82" y="46" width="36" height="6" fill="#ffffff"/>
  <rect x="82" y="60" width="36" height="6" fill="#ffffff"/>
  <rect x="82" y="74" width="36" height="6" fill="#ffffff"/>

  <!-- mic stand arc -->
  <path d="M 62 96 A 38 38 0 0 0 138 96" stroke="#000000" stroke-width="9" fill="none" stroke-linecap="round"/>
  <!-- stand post -->
  <rect x="96" y="130" width="8" height="20" fill="#000000"/>
  <!-- base -->
  <rect x="76" y="150" width="48" height="9" rx="4" fill="#000000"/>

  <!-- transcribed text lines below, representing audio to text -->
  <rect x="54" y="174" width="92" height="8" rx="4" fill="#000000"/>
  <rect x="66" y="188" width="68" height="8" rx="4" fill="#000000"/>
</svg>
