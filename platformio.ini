; PlatformIO project file for Aurigae, built against the pioarduino
; espressif32 platform fork (https://github.com/pioarduino/platform-espressif32),
; which tracks newer arduino-esp32 core releases than the stock PlatformIO
; espressif32 platform.
;
; Two boards are defined:
;  - esp32-cyd: ESP32-2432S028R ("Cheap Yellow Display" / CYD), 2.8" ILI9341
;    panel + XPT2046 resistive touch, generic 30-pin ESP32 dev module.
;  - esp32-s3-epaper154: Waveshare ESP32-S3-ePaper-1.54, a 1.54" 200x200
;    mono e-paper panel (SSD1681-class) + 2 physical buttons (no touch),
;    ESP32-S3.
;
; Board-specific hardware (display.cpp vs display_epaper.cpp, ui.cpp vs
; ui_epaper.cpp) is split via each env's build_src_filter below rather than
; the #ifdef-per-file trick transcribe_<provider>.cpp uses (see
; transcribe.h's top comment) - those provider files all share the same
; lib_deps regardless of which one compiles to something, so PlatformIO's
; library dependency finder is happy either way. TFT_eSPI/XPT2046_Touchscreen
; are only in esp32-cyd's lib_deps, and its LDF would fail to resolve
; display.cpp's #include of them if the epaper env tried to compile that
; file too (the LDF's textual #include scan doesn't evaluate #ifdef/#endif
; the way the compiler does) - so unlike the provider split, the board split
; needs the file itself left out of the build entirely, not just gated to a
; no-op inside it.

[env:esp32-cyd]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino

; equivalent to Arduino IDE "Partition Scheme: Huge App (3MB No OTA/1MB SPIFFS)"
board_build.partitions = huge_app.csv

monitor_speed = 115200

; See the board-split comment above - excludes the epaper board's own
; display/UI implementation (and its EPD driver headers) from this env's
; build entirely.
build_src_filter =
    +<*>
    -<display_epaper.cpp>
    -<ui_epaper.cpp>
    ; esp32-s3-epaper154-only speaker driver (see speaker.h's top comment) -
    ; excluded here for the same LDF reason as display_epaper.cpp/
    ; ui_epaper.cpp above: it #includes ESP8266Audio/I2S headers that
    ; aren't in this env's lib_deps.
    -<speaker.cpp>
    -<es8311.cpp>

lib_deps =
    bblanchon/ArduinoJson @ 7.4.1
    tzapu/WiFiManager @ 2.0.17
    bodmer/TFT_eSPI @ 2.5.43
    ; PIO registry only mirrors this lib as an untagged "0.0.0-alpha" build, so
    ; version-pin syntax can't resolve v1.4 — pull the tag straight from GitHub.
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
    ; 9.2.3 exists as an Arduino Library Manager release only, no matching git
    ; tag — PIO's registry mirrors lvgl/lvgl's tags, which stop at v9.2.2 before
    ; jumping to v9.3.0. v9.2.2 is config-compatible with our lv_conf.h (v9.2.0 format).
    lvgl/lvgl @ 9.2.2

build_flags =
    ; --- Board identity ---
    ; Gates board-specific features (currently antiburn.cpp's backlight
    ; blanking, which assumes this board's TFT_BL wiring, and storage.cpp's
    ; choice of SD-over-SPI vs SD-over-SDMMC) so they compile to the right
    ; thing per board instead of touching a pin/peripheral that may not
    ; exist there. Exactly one BOARD_* flag must be defined - see
    ; storage.cpp's #error if neither is.
    -D BOARD_CYD=1

    ; --- TFT_eSPI pin/driver config ---
    ; Skip TFT_eSPI's own User_Setup_Select.h and force-include our copy of
    ; User_Setup.h (include/User_Setup.h) ahead of every translation unit
    ; instead, per TFT_eSPI's documented PlatformIO setup.
    -D USER_SETUP_LOADED=1
    -include include/User_Setup.h

    ; --- LVGL config ---
    ; Force include/ onto the search path (PlatformIO's automatic project
    ; include_dir isn't picked up while compiling lib_deps sources like lvgl
    ; itself), then tell lvgl.h to '#include "lv_conf.h"' directly instead of
    ; looking for it next to the lvgl library folder.
    -I include
    -D LV_CONF_INCLUDE_SIMPLE=1

    ; --- AI transcription provider ---
    ; Selects which src/transcribe_<provider>.cpp implements transcribe.h's
    ; provider hooks (ai_provider_name(), ai_transcribe_file(), ...) - the
    ; others compile to nothing (each is wrapped in its own #ifdef). Exactly
    ; one AI_PROVIDER_* flag must be defined; swap this one for a different
    ; provider's instead of adding a second. See transcribe.h's top comment.
    ; Alternative: -D AI_PROVIDER_GEMINI=1 (src/transcribe_gemini.cpp).
    -D AI_PROVIDER_OPENAI=1
    ;-D AI_PROVIDER_GEMINI=1

[env:esp32-s3-epaper154]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.partitions = huge_app.csv

monitor_speed = 115200

; See the board-split comment above - excludes the CYD's own display/UI
; implementation (and its TFT_eSPI/XPT2046 dependency) from this env's build.
build_src_filter =
    +<*>
    -<display.cpp>
    -<ui.cpp>

lib_deps =
    bblanchon/ArduinoJson @ 7.4.1
    tzapu/WiFiManager @ 2.0.17
    lvgl/lvgl @ 9.2.2
    ; MP3 decode for speaker.cpp's onboard-speaker playback (ES8311 I2C
    ; register setup is our own es8311.cpp - see speaker.h's top comment).
    earlephilhower/ESP8266Audio @ 2.4.1
    ; MP3 *encode* for speaker.cpp's mic recording (mic_start_recording()) -
    ; lib/shine_mp3_esp32/ (this project's lib_dir, auto-discovered - no
    ; lib_deps entry needed). Vendored in-tree rather than pulled straight
    ; from GitHub like every other dependency here - see that folder's
    ; README.md for why (the upstream repo doesn't build as-is via
    ; lib_deps) and for its exact source commit/license.

build_flags =
    ; --- Board identity --- see esp32-cyd's build_flags comment above.
    -D BOARD_ESP32S3_EPAPER154=1

    ; --- USB CDC serial ---
    ; The board's own USB port is the ESP32-S3's native USB-JTAG/Serial
    ; peripheral (same port esptool flashes through) - ARDUINO_USB_MODE=1
    ; (set by this board's own board.json) only enables that peripheral,
    ; it doesn't retarget Arduino's `Serial` onto it. Without this flag
    ; `Serial` stays on physical UART0 (GPIO43/44 - broken out on the
    ; schematic as TXD/RXD, no USB bridge chip behind them on this board),
    ; so every Serial.print() in this firmware silently goes nowhere a
    ; plain `pio device monitor` on the USB port can see.
    -D ARDUINO_USB_CDC_ON_BOOT=1

    ; --- LVGL config --- same reasoning as esp32-cyd's.
    -I include
    -D LV_CONF_INCLUDE_SIMPLE=1

    ; --- AI transcription provider --- see esp32-cyd's build_flags comment.
    -D AI_PROVIDER_OPENAI=1
    ;-D AI_PROVIDER_GEMINI=1
