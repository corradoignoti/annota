; PlatformIO project file for Aurigae, built against the pioarduino
; espressif32 platform fork (https://github.com/pioarduino/platform-espressif32),
; which tracks newer arduino-esp32 core releases than the stock PlatformIO
; espressif32 platform.
;
; One board is defined: esp32-s3-epaper154, the Waveshare
; ESP32-S3-ePaper-1.54 - a 1.54" 200x200 mono e-paper panel (SSD1681-class)
; + 2 physical buttons (no touch) + an onboard ES8311 speaker/mic codec,
; on an ESP32-S3-PICO-1-N8R8 module: 8MB Quad SPI flash + 8MB Octal SPI
; PSRAM.
;
; `board = esp32-s3-devkitc-1` (not one of the platform's own N8R8 board
; IDs) is deliberate: this module's USB port is the ESP32-S3's
; USB-Serial-JTAG peripheral, which needs ARDUINO_USB_MODE=1 - set by
; esp32-s3-devkitc-1's own board.json, but *not* set by e.g.
; esp32-s3-devkitc1-n8r8's (which would silently flip Serial over to the
; native USB-OTG peripheral this module doesn't wire out, going dark).
; `board_build.arduino.memory_type = qio_opi` below is what actually picks
; the right prebuilt ESP-IDF libs (framework-arduinoespressif32-libs ships
; a separate esp32s3/<memory_type> variant per flash+PSRAM bus combo) -
; without it this env silently links the qio_qspi variant instead (Quad
; SPI PSRAM support, matching neither this module's Octal PSRAM chip nor
; any PSRAM at all if left fully unset), which is a build-config mismatch
; PSRAM init at boot can't paper over. `board_build.psram_type = opi` and
; `-D BOARD_HAS_PSRAM` (in build_flags below) both have to agree with it -
; see each one's own comment for which part of the toolchain actually
; reads it.

[env:esp32-s3-epaper154]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
framework = arduino

board_build.partitions = huge_app.csv

; See scripts/patch_wolfssl.py's own top comment: fixes a multiple-
; definition link error coming from a bug in wolfssl/Arduino-wolfSSL's own
; vendored wolfssl.h.
extra_scripts = pre:scripts/patch_wolfssl.py

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson @ 7.4.1
    tzapu/WiFiManager @ 2.0.17
    lvgl/lvgl @ 9.2.2
    ; MP3/WAV decode for speaker.cpp's onboard-speaker playback (ES8311 I2C
    ; register setup is our own es8311.cpp - see speaker.h's top comment).
    ; Mic recording (mic_start_recording()) writes plain PCM WAV directly -
    ; no separate encoder library needed for that side.
    earlephilhower/ESP8266Audio @ 2.4.1
    ; TLS backend for transcribe_openai.cpp/transcribe_gemini.cpp's
    ; WiFiClientSecure use - swapped from arduino-esp32's built-in mbedTLS
    ; to wolfSSL. xorlent/ESP32-EasyWolfSSL's WolfSSLClient (see its
    ; WolfSSLClient.h) typedefs itself as WiFiClientSecure, so both provider
    ; files only need their #include swapped, not their call sites - it
    ; extends NetworkClient (arduino-esp32 3.x's WiFiClient base) the same
    ; way NetworkClientSecure does, so HTTPClient::begin(NetworkClient&, ...)
    ; accepts it unchanged. wolfssl/wolfssl itself is pulled in
    ; automatically by PlatformIO's Library Dependency Finder from
    ; WolfSSLClient.h's #include <wolfssl.h> et al, but is pinned explicitly
    ; here anyway since an unpinned transitive dep silently tracking
    ; whatever the registry's default resolves to isn't something this
    ; project does anywhere else (see lvgl's pin above).
    xorlent/ESP32-EasyWolfSSL @ 1.0.0
    ; The Arduino-flavored package, not the plain "wolfssl/wolfssl" one - its
    ; bundled src/user_settings.h #undefs WOLFSSL_ESPIDF, which the plain
    ; package's settings.h otherwise force-defines whenever PLATFORMIO and
    ; ESP_PLATFORM are both set (true here even under framework=arduino,
    ; since arduino-esp32 3.x builds Arduino as an ESP-IDF component) - and
    ; then hard #errors on seeing both WOLFSSL_ESPIDF and ARDUINO defined at
    ; once, having no way to tell that combination apart from an actual
    ; ESP-IDF project from macros alone.
    wolfssl/Arduino-wolfSSL @ 5.7.2
    ; QR code for ui_epaper.cpp's kWifiJoined screen (encodes the http://
    ; URL so it can be scanned instead of typed in). Plain C, no LVGL/Arduino
    ; dependency of its own - ui_epaper.cpp renders the module grid itself
    ; onto an lv_canvas.
    ricmoo/QRCode @ 0.0.1

; ESP32-EasyWolfSSL's own library.properties names its dependency just
; "wolfssl" (a library-name hint, not an owner/name pin), which PlatformIO's
; Library Dependency Finder resolves to the plain wolfssl/wolfssl package
; regardless of wolfssl/Arduino-wolfSSL already being pinned above in
; lib_deps - pulling both in side by side and then preferring plain
; wolfssl's headers over Arduino-wolfSSL's for the shared <wolfssl.h> /
; <wolfssl/wolfcrypt/settings.h> include path, right back into the
; ESPIDF/ARDUINO conflict pinning Arduino-wolfSSL was meant to dodge (see
; that pin's own comment above). Excluding it here forces the LDF to fall
; back to deep-scanning for a provider of those headers, which finds
; Arduino-wolfSSL instead.
lib_ignore = wolfssl

build_flags =
    ; --- USB CDC serial ---
    ; The board's own USB port is the ESP32-S3's native USB-JTAG/Serial
    ; peripheral (same port esptool flashes through) - ARDUINO_USB_MODE=1
    ; (set by this board's own board.json) only enables that peripheral,
    ; it doesn't retarget Arduino's `Serial` onto it. Without this flag
    ; `Serial` stays on physical UART0 (GPIO43/44 - broken out on the
    ; schematic as TXD/RXD, no USB bridge chip behind them on this board),
    ; so every Serial.print() in this firmware silently goes nowhere a
    ; plain `pio device monitor` on the USB port can see.
    -D ARDUINO_USB_CDC_ON_BOOT=1

    ; --- wolfSSL TLS extensions ---
    ; wolfssl/Arduino-wolfSSL's shipped user_settings.h doesn't define
    ; HAVE_SNI, so wolfSSL_UseSNI() (scripts/patch_wolfssl.py patches it
    ; into ESP32-EasyWolfSSL's WolfSSLClient::connect()) compiles to
    ; nothing without this - and without an SNI extension in the
    ; ClientHello, hosts fronted by Cloudflare (api.openai.com included)
    ; drop the TLS handshake outright rather than falling back to a
    ; default cert, which is what actually surfaces as a connect()
    ; failure/"connection refused" out of HTTPClient, not anything
    ; specific to OpenAI's own API.
    -D HAVE_SNI

    ; --- PSRAM ---
    ; Not derived automatically from board_build.psram_type above (that
    ; only picks which prebuilt ESP-IDF libs get linked) - this is the
    ; flag arduino-esp32's own core code (e.g. WString.h's String)
    ; actually checks to decide whether to use PSRAM at all.
    -D BOARD_HAS_PSRAM

    ; --- LVGL config ---
    ; Force include/ onto the search path (PlatformIO's automatic project
    ; include_dir isn't picked up while compiling lib_deps sources like lvgl
    ; itself), then tell lvgl.h to '#include "lv_conf.h"' directly instead of
    ; looking for it next to the lvgl library folder.
    -I include
    -D LV_CONF_INCLUDE_SIMPLE=1

    ; --- AI transcription provider ---
    ; Selects which src/transcribe_<provider>.cpp implements transcribe.h's
    ; provider hooks (ai_provider_name(), ai_transcribe_file(), ...) - the
    ; others compile to nothing (each is wrapped in its own #ifdef). Exactly
    ; one AI_PROVIDER_* flag must be defined; swap this one for a different
    ; provider's instead of adding a second. See transcribe.h's top comment.
    ; Alternative: -D AI_PROVIDER_GEMINI=1 (src/transcribe_gemini.cpp).
    -D AI_PROVIDER_OPENAI=1
    ;-D AI_PROVIDER_GEMINI=1
